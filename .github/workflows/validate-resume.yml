name: Validate resume.json

on:
  push:
    paths:
      - "resume.json"
      - "package.json"
      - ".github/workflows/validate-resume.yml"
  pull_request:
    paths:
      - "resume.json"
      - "package.json"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Validate JSON Resume
        run: npm run validate
